[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22.12.0"

# El apex tiene que redirigir a www, que es el host de `site` en astro.config.mjs
# y el de todos los canonical. Sin esta regla Google indexa jeanmarte.com y
# www.jeanmarte.com como dos sitios distintos y parte el ranking entre los dos.
[[redirects]]
  from = "https://jeanmarte.com/*"
  to = "https://www.jeanmarte.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap-index.xml"
  status = 301


# Los assets de /_astro/ llevan hash de contenido en el nombre: un cambio genera
# un nombre nuevo, así que se pueden cachear para siempre. Con el default de
# Netlify se revalidaban en cada visita.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/Certificados Portafolio/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # Google Tag Manager + GA4 + Vercel Analytics necesitan hosts extra:
    #   script-src  -> gtm.js y gtag/js se sirven desde googletagmanager.com
    #   connect-src -> GA4 manda los hits por sendBeacon/fetch a *.google-analytics.com
    #                  (incluye endpoints regionales tipo region1.google-analytics.com)
    #   frame-src   -> el <noscript> de GTM inserta un iframe a googletagmanager.com/ns.html
    # Vercel Web Analytics usa /_vercel/insights (mismo origen), ya cubierto por 'self'.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://api.web3forms.com https://www.googletagmanager.com https://*.google-analytics.com https://*.analytics.google.com https://*.g.doubleclick.net; frame-src https://www.googletagmanager.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://api.web3forms.com;"

