# NOTA: el sitio en producción (www.jeanmarte.com) se está sirviendo desde
# Vercel, no desde Netlify — las cabeceras que realmente aplican en vivo
# coinciden con public/_headers, no con lo definido en este archivo. Si el
# host real vuelve a ser Netlify en el futuro, revisar que ambos archivos
# sigan diciendo lo mismo (ver public/_headers y public/_redirects).

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22.12.0"

# El apex tiene que redirigir a www, que es el host de `site` en astro.config.mjs
# y el de todos los canonical. Sin esta regla Google indexa jeanmarte.com y
# www.jeanmarte.com como dos sitios distintos y parte el ranking entre los dos.
[[redirects]]
  from = "https://jeanmarte.com/*"
  to = "https://www.jeanmarte.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap-index.xml"
  status = 301


# Los assets de /_astro/ llevan hash de contenido en el nombre: un cambio genera
# un nombre nuevo, así que se pueden cachear para siempre. Con el default de
# Netlify se revalidaban en cada visita.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/Certificados Portafolio/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://api.web3forms.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://api.web3forms.com;"

